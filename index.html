<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e1e2e">
<title>Tebak Angka</title>
<link rel="manifest" href="manifest.json">
<style>
    body {
        font-family: Arial, sans-serif;
        background: #1e1e2e;
        color: white;
        text-align: center;
        padding: 20px;
        margin: 0;
    }
    .container {
        max-width: 400px;
        margin: auto;
        background: #313244;
        padding: 20px;
        border-radius: 15px;
        margin-top: 20px;
    }
    h1 { color: #89b4fa; }
    input {
        font-size: 24px;
        width: 80px;
        text-align: center;
        padding: 10px;
        border-radius: 10px;
        border: none;
    }
    button {
        font-size: 18px;
        padding: 12px 24px;
        margin: 10px;
        border: none;
        border-radius: 10px;
        background: #89b4fa;
        color: #1e1e2e;
        font-weight: bold;
    }
    button:active { background: #74c7ec; }
    #pesan { font-size: 20px; margin: 15px 0; min-height: 30px; }
    #btnInstall {
        background: #a6e3a1;
        display: none;
    }
</style>
</head>
<body>
<div class="container">
    <h1>TEBAK ANGKA 1-10</h1>
    <p id="info">Kamu punya 5 nyawa!</p>
    <input type="number" id="tebakan" min="1" max="10">
    <br>
    <button onclick="tebak()">TEBAK</button>
    <button id="btnInstall" onclick="installApp()">INSTALL APP</button>
    <div id="pesan"></div>
    <button onclick="resetGame()" style="display:none" id="btnReset">MAIN LAGI</button>
</div>

<script>
let deferredPrompt;
let angkaRahasia = Math.floor(Math.random() * 10) + 1;
let nyawa = 5;
let percobaan = 0;

// Deteksi kalau bisa diinstall
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('btnInstall').style.display = 'inline-block';
});

function installApp() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
            deferredPrompt = null;
            document.getElementById('btnInstall').style.display = 'none';
        });
    }
}

function tebak() {
    let tebakan = parseInt(document.getElementById('tebakan').value);
    if (!tebakan || tebakan < 1 || tebakan > 10) {
        document.getElementById('pesan').innerText = "Masukin angka 1-10 dong!";
        return;
    }
    
    percobaan++;
    if (tebakan === angkaRahasia) {
        document.getElementById('pesan').innerText = `YESS bener! Menang dalam ${percobaan} kali 🔥`;
        endGame();
    } else if (tebakan < angkaRahasia) {
        document.getElementById('pesan').innerText = "Kekecilan bro";
    } else {
        document.getElementById('pesan').innerText = "Kebesaran bro";
    }
    
    nyawa--;
    document.getElementById('info').innerText = `Sisa nyawa: ${nyawa}`;
    if (nyawa === 0) {
        document.getElementById('pesan').innerText = `Kalah! Angkanya ${angkaRahasia}`;
        endGame();
    }
    document.getElementById('tebakan').value = "";
}

function endGame() {
    document.getElementById('tebakan').disabled = true;
    document.querySelector('button[onclick="tebak()"]').disabled = true;
    document.getElementById('btnReset').style.display = 'inline-block';
}

function resetGame() {
    angkaRahasia = Math.floor(Math.random() * 10) + 1;
    nyawa = 5;
    percobaan = 0;
    document.getElementById('info').innerText = "Kamu punya 5 nyawa!";
    document.getElementById('pesan').innerText = "";
    document.getElementById('tebakan').disabled = false;
    document.querySelector('button[onclick="tebak()"]').disabled = false;
    document.getElementById('btnReset').style.display = 'none';
}

// Daftar service worker biar bisa offline
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
