<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tebak Angka</title>
  
  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #1e1e2e;
      color: #fff;
    }

    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      font-size: 28px;
    }

    .game {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    input {
      padding: 12px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      text-align: center;
      width: 200px;
      margin: 0 auto;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #7c3aed;
      color: white;
      cursor: pointer;
      width: 200px;
      margin: 0 auto;
    }

    button:hover {
      background: #6d28d9;
    }

    #result {
      font-size: 20px;
      min-height: 30px;
    }

    .credit {
      font-size: 14px;
      color: #a0a0b0;
      text-align: center;
      margin-top: 30px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tebak Angka</h1>
    
    <div class="game">
      <p>Guessing game 1-100</p>
      <input type="number" id="guess" placeholder="Masukkan angka">
      <button onclick="checkGuess()">Tebak</button>
      <p id="result"></p>
    </div>

    <p class="credit">by farel</p>
  </div>

  <script>
    let target = Math.floor(Math.random() * 100) + 1;
    
    function checkGuess() {
      let guess = document.getElementById('guess').value;
      let result = document.getElementById('result');
      
      if (guess == target) {
        result.textContent = "Benar! 🎉";
      } else if (guess < target) {
        result.textContent = "Terlalu kecil!";
      } else {
        result.textContent = "Terlalu besar!";
      }
    }

    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
